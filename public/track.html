<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — d.jr</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><div class="nav"><a class="brand" href="/"><span>d.jr</span> FOOTBALL</a></div></header><main class="container" style="max-width:700px;padding-top:60px"><p class="eyebrow">ORDER TRACKING</p><h1>Track your order</h1><form id="f"><input id="o" class="checkout input" style="width:100%;background:#0c0e11;border:1px solid #30343b;color:#fff;padding:13px;border-radius:7px" placeholder="Enter order number" required><button class="primary full">Track</button></form><div id="result" style="margin-top:25px"></div></main><script>
const q=new URLSearchParams(location.search).get("order");if(q)document.getElementById("o").value=q;
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const no=document.getElementById("o").value.trim();const r=await fetch("/api/orders/"+encodeURIComponent(no));const d=await r.json();if(!r.ok){document.getElementById("result").innerHTML="<p class='muted'>Order not found.</p>";return}document.getElementById("result").innerHTML="<div class='modal' style='width:100%'><p class='eyebrow'>"+d.order_no+"</p><h2>"+d.status+"</h2><p>"+d.customer_name+"</p><p class='muted'>"+d.city+" · Total "+new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(d.total)+"</p><hr><p class='muted'>Items: "+d.items.map(x=>x.name+" × "+x.qty).join(", ")+"</p></div>"})
</script></body></html>
