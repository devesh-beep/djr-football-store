<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — d.jr Football Store</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="login" class="overlay"><div class="modal"><p class="eyebrow">d.jr ADMIN</p><h2>Store manager</h2><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="primary full" onclick="login()">Login</button><p class="muted">Change the default password in .env before going live.</p></div></div>
<header class="top"><div class="nav"><a class="brand" href="/"><span>d.jr</span> FOOTBALL</a><strong>Admin dashboard</strong><button class="cart-btn" onclick="logout()">Logout</button></div></header>
<main class="container">
<div id="stats" class="trust"></div>
<section class="admin-section"><div class="section-head"><h2>Products</h2><button class="primary" onclick="newProduct()">+ Add product</button></div><div id="productsAdmin"></div></section>
<section class="admin-section"><div class="section-head"><h2>Orders</h2></div><div id="ordersAdmin"></div></section>
</main>
<div id="productForm" class="overlay hidden"><div class="modal"><button class="close" onclick="closeForm()">×</button><h2 id="formTitle">Add product</h2><form id="pf" enctype="multipart/form-data"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required><div class="two"><input name="price" type="number" placeholder="Selling price" required><input name="mrp" type="number" placeholder="MRP"></div><div class="two"><input name="discount" type="number" placeholder="Discount %"><input name="stock" type="number" placeholder="Stock" required></div><input name="sizes" placeholder="Sizes e.g. S,M,L,XL"><textarea name="description" placeholder="Description"></textarea><input name="image" type="file" accept="image/*"><label><input name="featured" type="checkbox"> Featured</label><button class="primary full">Save product</button></form></div></div>
<script>
let auth=JSON.parse(localStorage.getItem("djrAdminAuth")||"null"), editing=null;
const H=()=>auth||{};const api=(url,opt={})=>fetch(url,{...opt,headers:{...(opt.headers||{}),"x-admin-user":H().u||"","x-admin-pass":H().p||""}});
function login(){const u=document.getElementById("user").value,p=document.getElementById("pass").value;fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})}).then(r=>{if(!r.ok)throw 0;auth={u,p};localStorage.setItem("djrAdminAuth",JSON.stringify(auth));document.getElementById("login").classList.add("hidden");loadAdmin()}).catch(()=>alert("Invalid login"))}
function logout(){localStorage.removeItem("djrAdminAuth");location.reload()}
if(auth)document.getElementById("login").classList.add("hidden");
async function loadAdmin(){const [s,p,o]=await Promise.all([api("/api/admin/stats").then(r=>r.json()),api("/api/products").then(r=>r.json()),api("/api/admin/orders").then(r=>r.json())]);document.getElementById("stats").innerHTML=`<div><b>₹</b><span><strong>Sales</strong><small>₹${Number(s.sales).toLocaleString("en-IN")}</small></span></div><div><b>${s.orderCount}</b><span><strong>Orders</strong><small>${s.pending} active</small></span></div><div><b>${s.productCount}</b><span><strong>Products</strong><small>In catalogue</small></span></div>`;document.getElementById("productsAdmin").innerHTML=`<div class="table">${p.map(x=>`<div class="row"><span><b>${x.name}</b><small>${x.category} · ₹${x.price} · Stock ${x.stock}</small></span><span><button class="secondary" onclick='editProduct(${JSON.stringify(x)})'>Edit</button> <button class="secondary" onclick="deleteProduct(${x.id})">Delete</button></span></div>`).join("")}</div>`;document.getElementById("ordersAdmin").innerHTML=`<div class="table">${o.map(x=>`<div class="row"><span><b>${x.order_no}</b><small>${x.customer_name} · ₹${x.total} · UTR ${x.utr}</small></span><select onchange="status(${x.id},this.value)">${["Payment Submitted","Payment Verified","Packed","Shipped","Delivered","Cancelled"].map(v=>`<option ${v===x.status?"selected":""}>${v}</option>`).join("")}</select></div>`).join("")||"<p class='muted'>No orders yet.</p>"}</div>`}
function newProduct(){editing=null;document.getElementById("pf").reset();document.getElementById("formTitle").textContent="Add product";document.getElementById("productForm").classList.remove("hidden")}
function editProduct(x){editing=x;const f=document.getElementById("pf");Object.keys(x).forEach(k=>{if(f.elements[k]&&k!=="sizes")f.elements[k].value=Array.isArray(x[k])?x[k].join(","):x[k]});f.elements.sizes.value=x.sizes.join(",");f.elements.featured.checked=!!x.featured;document.getElementById("formTitle").textContent="Edit product";document.getElementById("productForm").classList.remove("hidden")}
function closeForm(){document.getElementById("productForm").classList.add("hidden")}
document.getElementById("pf").addEventListener("submit",async e=>{e.preventDefault();const fd=new FormData(e.target);let url="/api/admin/products",method="POST";if(editing){url+="/"+editing.id;method="PUT";if(!fd.get("image").size)fd.delete("image");if(!fd.get("image").size&&editing.image)fd.append("image",editing.image)}const r=await api(url,{method,body:fd});const d=await r.json();if(!r.ok)return alert(d.error||"Error");closeForm();loadAdmin()});
async function deleteProduct(id){if(confirm("Delete this product?")){await api("/api/admin/products/"+id,{method:"DELETE"});loadAdmin()}}
async function status(id,s){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});loadAdmin()}
if(auth)loadAdmin();
</script><style>.admin-section{margin:35px 0}.table{border:1px solid #292c32;border-radius:10px;overflow:hidden}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px;background:#111318;border-bottom:1px solid #25282d}.row:last-child{border-bottom:0}.row small{display:block;color:#777;margin-top:4px}.row select{background:#17191d;color:#fff;border:1px solid #3a3d44;padding:8px;border-radius:6px}.admin-section .secondary{margin:0}.modal input,.modal textarea{width:100%;background:#0c0e11;border:1px solid #30343b;color:#fff;padding:12px;border-radius:7px;margin-bottom:10px}.modal textarea{min-height:80px}.modal label{color:#bbb;display:block;margin:8px 0}</style></body></html>
